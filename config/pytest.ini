[pytest]
python_files =
  test_*.py
addopts =
  --cov
  --cov-config config/coverage.ini
testpaths =
  tests

# action:message_regex:warning_class:module_regex:line
filterwarnings =
  error
  default::EncodingWarning
  error::EncodingWarning:efts_io
  # As per claude ai:
  # this warning is a known benign issue that occurs when netCDF4 is built against a 
  # different NumPy ABI than the one currently installed. It doesn't cause runtime 
  # errors in practice; it's just a C extension mismatch in metadata. 
  # You can suppress it safely while you wait for a compatible rebuild 
  # (e.g. via pip install --force-reinstall netCDF4 or upgrading NumPy). 
  # Suppressing it here is the right call so real errors remain visible.
  ignore:numpy.ndarray size changed:RuntimeWarning
  # TODO: remove once pytest-xdist 4 is released
  ignore:.*rsyncdir:DeprecationWarning:xdist
